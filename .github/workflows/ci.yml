name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test grammar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --omit peer --omit optional
      - name: Run corpus tests
        run: npx tree-sitter test
      - name: Test Node binding
        run: npm test
      - name: Build Wasm
        run: npx tree-sitter build --wasm
